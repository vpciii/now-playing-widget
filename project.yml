name: NowPlaying
options:
  bundleIdPrefix: local.nowplaying
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # No Apple developer team on this Mac yet: sign to run locally.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
packages:
  NowPlayingCore:
    path: Packages/NowPlayingCore
targets:
  NowPlaying:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: NowPlayingCore
      - target: NowPlayingWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.nowplaying.app
        CODE_SIGN_ENTITLEMENTS: App/NowPlaying.entitlements
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Now Playing
        LSUIElement: true
        NSAppleEventsUsageDescription: Now Playing reads the current song from Music and sends it skip, back and play/pause commands.
  NowPlayingWidget:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: NowPlayingCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.nowplaying.app.widget
        CODE_SIGN_ENTITLEMENTS: Widget/NowPlayingWidget.entitlements
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Now Playing
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
